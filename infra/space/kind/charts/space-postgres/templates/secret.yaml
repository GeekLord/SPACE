apiVersion: v1
kind: Secret
metadata:
  name: space-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.database | quote }}
  POSTGRES_CONNECTION_STRING: "postgres://{{ .Values.credentials.user }}:{{ .Values.credentials.password }}@{{ .Values.service.name }}:{{ .Values.service.port }}/{{ .Values.credentials.database }}?sslmode=disable"
