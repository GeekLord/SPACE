# Same RBAC shape as the prod space-node-ctl chart: node-ctl's Kubernetes
# node-local controller watches its own Node and advertises the
# space.pplx.net/network-slots extended resource on status.capacity (the
# production source of the capacity bootstrap.sh also seeds statically).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-node-stack
  namespace: {{ .Release.Namespace }}
  labels:
    space.pplx.net/chart: space-node-stack
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-node-stack-node-ctl
  labels:
    space.pplx.net/chart: space-node-stack
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Cluster-wide, and narrowed at admission instead: see
  # templates/node-fence.yaml. `patch nodes/status` below reaches
  # `metadata.labels` too, so the fence matches both resources.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Advertise the space.pplx.net/network-slots extended resource on the Node's
  # status.capacity so the scheduler accounts for node-manager network slots.
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-node-stack-node-ctl
  labels:
    space.pplx.net/chart: space-node-stack
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-node-stack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-node-stack-node-ctl
