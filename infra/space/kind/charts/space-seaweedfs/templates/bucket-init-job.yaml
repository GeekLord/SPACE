apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seaweedfs-bucket-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-seaweedfs-bucket-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: space-seaweedfs-bucket-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bucket-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              master="{{ .Values.service.name }}:{{ .Values.service.masterPort }}"
              echo "waiting for SeaweedFS master at $master"
              # cluster.ps connects to the master gRPC and lists processes —
              # a reliable readiness probe before we create the bucket.
              until echo 'cluster.ps' | weed shell -master="$master" >/dev/null 2>&1; do
                sleep 2
              done
              # Buckets are filer directories; creation is idempotent enough for
              # our purposes — ignore "already exists" on re-runs.
              echo 's3.bucket.create -name {{ .Values.snapshotBucket }}' | weed shell -master="$master" || true
              echo 's3.bucket.create -name {{ .Values.templateBucket }}' | weed shell -master="$master" || true
              echo 's3.bucket.list' | weed shell -master="$master"
              echo "buckets {{ .Values.snapshotBucket }} + {{ .Values.templateBucket }} ready"
