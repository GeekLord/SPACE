apiVersion: v1
kind: Secret
metadata:
  name: space-seaweedfs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Consumed by volume-manager as static S3 credentials (local-dev escape hatch
  # that bypasses credmgr's STS/IRSA exchange — see
  # crates/libs/vol/mgr/server/src/run.rs).
  SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID: {{ .Values.credentials.accessKey | quote }}
  SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY: {{ .Values.credentials.secretKey | quote }}
  # SeaweedFS S3 identity config — same credentials, so sigv4-signed requests
  # from vol-mgr are actually validated (not anonymous). Mounted at
  # /etc/seaweedfs/s3.json via -s3.config.
  s3.json: |
    {
      "identities": [
        {
          "name": {{ .Values.credentials.accessKey | quote }},
          "credentials": [
            {
              "accessKey": {{ .Values.credentials.accessKey | quote }},
              "secretKey": {{ .Values.credentials.secretKey | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging", "ReadAcp", "WriteAcp"]
        }
      ]
    }
