apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: space-seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: {{ .Values.service.s3Port }}
      targetPort: s3
      protocol: TCP
    - name: filer
      port: {{ .Values.service.filerPort }}
      targetPort: filer
      protocol: TCP
    - name: master
      port: {{ .Values.service.masterPort }}
      targetPort: master
      protocol: TCP
    - name: master-grpc
      port: {{ add .Values.service.masterPort 10000 }}
      targetPort: master-grpc
      protocol: TCP
