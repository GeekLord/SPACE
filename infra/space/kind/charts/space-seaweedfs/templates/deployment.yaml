apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-seaweedfs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: space-seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    # Single all-in-one store over one data dir; never two replicas.
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-seaweedfs
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: seaweedfs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # All-in-one master+volume+filer+s3. Bind/advertise on the pod IP so the
          # kubelet probes and the Service (both target the pod IP) reach every
          # port — `-ip=localhost` would bind loopback and make them unreachable.
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=$(POD_IP)
            - -master.port={{ .Values.service.masterPort }}
            # SeaweedFS pre-allocates volume files of this size and refuses
            # writes ("topo failed to pick 1 from 0 node candidates" → S3 500
            # InternalError) once the disk can't fit another one. The default
            # is 30 GB — bigger than the whole local docker disk budget — so
            # size volumes for the kind harness. Snapshot uploads wedge in
            # `creating` (and evacuation restores never fire) when this is
            # exhausted.
            - -master.volumeSizeLimitMB={{ .Values.volumeSizeLimitMB }}
            - -volume.max={{ .Values.volumeMaxCount }}
            - -filer
            - -filer.port={{ .Values.service.filerPort }}
            - -s3
            - -s3.port={{ .Values.service.s3Port }}
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: s3
              containerPort: {{ .Values.service.s3Port }}
              protocol: TCP
            - name: filer
              containerPort: {{ .Values.service.filerPort }}
              protocol: TCP
            - name: master
              containerPort: {{ .Values.service.masterPort }}
              protocol: TCP
            # Master gRPC (= masterPort + 10000); weed shell dials this for
            # bucket-init.
            - name: master-grpc
              containerPort: {{ add .Values.service.masterPort 10000 }}
              protocol: TCP
          # S3 binds ~20-25s after start (master → volume → filer → s3), so the
          # probes are lenient: readiness gates traffic on the S3 port, liveness
          # targets the early-binding master with a wide failure budget so the
          # bootstrap window never restart-loops the pod.
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: master
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # hostPath (not emptyDir): the volume server is pinned to the infra
        # node via nodeSelector, and object data must survive a pod restart —
        # an emptyDir wipe loses the published seed + every suspend snapshot,
        # which strands template pulls and cross-node restores until a manual
        # re-publish. The node-local dir persists across pod rolls.
        - name: data
          hostPath:
            path: /var/lib/space-seaweedfs
            type: DirectoryOrCreate
        - name: s3-config
          secret:
            secretName: space-seaweedfs
            items:
              - key: s3.json
                path: s3.json
