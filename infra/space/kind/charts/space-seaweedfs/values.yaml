# SeaweedFS — local S3-compatible object store for the KinD SPACE stack.
#
# Replaces MinIO (whose community images went behind a paid subscription).
# SeaweedFS is Apache-2.0 and actively maintained. volume-manager (real, on the
# node-stack DaemonSet) uploads/pulls suspend-restore snapshot artifacts here
# via the production object-store crate with an S3 endpoint override + path-style
# addressing. Nothing here is a stub.

image:
  repository: chrislusf/seaweedfs
  tag: "4.31"
  pullPolicy: IfNotPresent

datadogTeam: team-space

service:
  name: seaweedfs
  # S3 API port (the only one vol-mgr talks to).
  s3Port: 8333
  # Filer HTTP (also serves a browsable UI).
  filerPort: 8888
  # Master HTTP (weed shell connects here for bucket-init).
  masterPort: 9333

# Dev-only S3 credentials. Handed to volume-manager as static creds
# (SPACE_OBJECT_STORE_STATIC_*) and configured as a SeaweedFS S3 identity so
# sigv4 is actually validated. Do NOT put the substring "space" (or "minio")
# anywhere in these values: Tilt redacts secret VALUES from command lines
# (including docker build-args), so a "space" substring would poison every
# `docker build … space-rust-build-… …` invocation. See space-postgres values.
credentials:
  accessKey: localadmin
  secretKey: localadmin-dev-secret

# Buckets created by the init Job. `snapshots` carries suspend/restore
# artifacts (volume-manager push/pull); `templates` carries template release
# artifacts published by the space-seed-publish Job and pulled by worker
# template-managers.
snapshotBucket: snapshots
templateBucket: templates

# Volume sizing for the small local disk: 1 GiB volume files, allocated on
# demand up to the count below (default 30 GB volumes would exhaust the kind
# node's disk after the first one and 500 every subsequent upload).
volumeSizeLimitMB: 1024
# Bumped from 16: the bench does repeated template + suspend-snapshot uploads
# across e2e runs, and each collection/growth grabs a volume slot; 16 slots
# exhaust mid-run (writes then 500 / silently drop). 48×1GiB sparse volumes
# fit the loopback disk (allocated on demand) and keep the pool from filling.
volumeMaxCount: 48

# SeaweedFS placed on the infra node so a sandbox-worker drain never disturbs
# the object store.
nodeSelector:
  space.pplx.net/infra: "true"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    # Large OCI template artifacts make the all-in-one volume/filer/S3 process
    # exceed 2Gi during multipart publication.
    memory: 4Gi
