[package]
name = "pplx-space-local-node-mgr-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pplx_space_local_node_mgr"
path = "src/lib.rs"

[[bin]]
name = "space-local-nodemgr-svc"
path = "src/main.rs"

[features]
default = []
otel = ["pplx-space-common-svc/otel"]
datadog = ["otel", "pplx-space-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dashmap = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["signal"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-common-svc = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
